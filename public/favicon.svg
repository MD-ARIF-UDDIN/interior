<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Rich Smoked Walnut & Teak Wood Gradient -->
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3222" />
      <stop offset="50%" stop-color="#322015" />
      <stop offset="100%" stop-color="#1A0F0A" />
    </linearGradient>

    <!-- Warm Brushed Brass / Gold Joinery Gradient -->
    <linearGradient id="brassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D086" />
      <stop offset="50%" stop-color="#DCA764" />
      <stop offset="100%" stop-color="#9E6D30" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Wooden Block with Rounded Chamfer -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#woodGradient)" stroke="url(#brassGradient)" stroke-width="2.5" filter="url(#shadow)" />

  <!-- Inner Architectural Inlay Border -->
  <rect x="7" y="7" width="50" height="50" rx="10" fill="none" stroke="url(#brassGradient)" stroke-width="1" stroke-dasharray="3,2" stroke-opacity="0.6" />

  <!-- Monogram Glyph: "RI" (Rezaul Interior) -->
  <g fill="url(#brassGradient)" filter="url(#shadow)">
    <!-- Letter 'R' (Architectural Serif & Precision Proportions) -->
    <path d="M16 19 h 11 c 4.2 0 6.8 2.3 6.8 6.2 c 0 3.2 -2.1 5.3 -4.8 6 l 5.4 12.8 h -5 l -4.9 -11.5 h -3.8 v 11.5 H 16 Z M 20.7 23.3 v 5.7 h 5.8 c 1.8 0 3 -1 3 -2.85 c 0 -1.85 -1.2 -2.85 -3 -2.85 Z" />
    
    <!-- Letter 'I' (Architectural Column Serif) -->
    <path d="M37 19 h 11 v 4.3 h -3.2 v 16.4 h 3.2 v 4.3 H 37 v -4.3 h 3.2 V 23.3 H 37 Z" />

    <!-- Corner Joinery Accents -->
    <circle cx="10" cy="10" r="1.5" fill="url(#brassGradient)" />
    <circle cx="54" cy="10" r="1.5" fill="url(#brassGradient)" />
    <circle cx="10" cy="54" r="1.5" fill="url(#brassGradient)" />
    <circle cx="54" cy="54" r="1.5" fill="url(#brassGradient)" />
  </g>
</svg>