<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="woodBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3222" />
      <stop offset="100%" stop-color="#22140D" />
    </linearGradient>
    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D086" />
      <stop offset="50%" stop-color="#DCA764" />
      <stop offset="100%" stop-color="#A27134" />
    </linearGradient>
  </defs>

  <!-- Left Monogram Tile -->
  <rect x="10" y="10" width="60" height="60" rx="12" fill="url(#woodBadge)" stroke="url(#brassGold)" stroke-width="2" />
  <rect x="15" y="15" width="50" height="50" rx="8" fill="none" stroke="url(#brassGold)" stroke-width="1" stroke-dasharray="3,2" opacity="0.6" />

  <!-- Monogram RI -->
  <g fill="url(#brassGold)">
    <!-- Letter 'R' -->
    <path d="M23 27 h 10.5 c 3.8 0 6.2 2 6.2 5.5 c 0 2.8 -1.9 4.6 -4.2 5.2 l 4.8 11.3 h -4.4 l -4.3 -10.2 h -3.6 v 10.2 H 23 Z M 27.2 30.8 v 5 h 5.2 c 1.6 0 2.6 -0.9 2.6 -2.5 c 0 -1.6 -1 -2.5 -2.6 -2.5 Z" />
    <!-- Letter 'I' -->
    <path d="M43 27 h 9.5 v 3.6 h -2.8 v 14.8 h 2.8 v 3.6 H 43 v -3.6 h 2.8 V 30.6 H 43 Z" />
  </g>

  <!-- Brand Typography -->
  <text x="85" y="42" font-family="'Cormorant Garamond', Georgia, serif" font-size="25" font-weight="700" letter-spacing="2.5" fill="url(#brassGold)">REZAUL INTERIOR</text>
  <text x="86" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" letter-spacing="2" fill="#BAA99B">ARCHITECTURE &amp; INTERIORS • CHATTOGRAM</text>
</svg>
